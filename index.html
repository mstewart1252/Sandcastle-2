<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sandcastle Siege</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1b2a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }
    #game-container {
      position: relative;
      width: 480px;
      height: 854px;
      max-height: 100dvh;
      max-width: 100vw;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    /* HUD Overlay */
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #hud > * { pointer-events: auto; }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 12px;
    }
    .hud-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 10px 12px 14px;
    }

    /* Tide Timer */
    #tide-timer {
      background: rgba(0,0,0,0.65);
      border: 1px solid #4a90d9;
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 13px;
      min-width: 120px;
    }
    #tide-timer .label { color: #4a90d9; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    #tide-timer .time { font-size: 22px; font-weight: bold; font-family: monospace; }
    #wave-incoming { font-size: 11px; color: #f0c040; margin-top: 2px; min-height: 15px; }

    /* Faith Meter */
    #faith-panel {
      background: rgba(0,0,0,0.65);
      border: 1px solid #c0a030;
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 13px;
      min-width: 110px;
      text-align: right;
    }
    #faith-panel .label { color: #c0a030; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    #faith-bar-wrap {
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      height: 8px;
      margin-top: 4px;
    }
    #faith-bar {
      height: 8px;
      border-radius: 4px;
      background: #c0a030;
      transition: width 0.5s, background 0.5s;
    }
    #faith-value { font-size: 11px; margin-top: 2px; }

    /* Resources */
    #resources {
      background: rgba(0,0,0,0.65);
      border: 1px solid #666;
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 12px;
    }
    .res-row { display: flex; gap: 12px; }
    .res-item { display: flex; align-items: center; gap: 3px; }
    .res-icon { font-size: 14px; }
    .res-count { font-family: monospace; font-size: 13px; font-weight: bold; }

    /* Decree Button */
    #decree-btn {
      background: linear-gradient(135deg, #b8860b, #daa520);
      border: 2px solid #ffd700;
      border-radius: 50%;
      width: 64px;
      height: 64px;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(218,165,32,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      user-select: none;
    }
    #decree-btn:active { transform: scale(0.95); }
    #decree-btn.on-cooldown { opacity: 0.5; cursor: not-allowed; }
    #decree-btn .icon { font-size: 22px; }

    /* Chronicle Button */
    #chronicle-btn {
      background: rgba(0,0,0,0.65);
      border: 1px solid #8b7355;
      border-radius: 8px;
      padding: 8px 12px;
      color: #d4b896;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      min-width: 80px;
      transition: background 0.2s;
      user-select: none;
    }
    #chronicle-btn:hover { background: rgba(139,115,85,0.3); }
    #chronicle-btn.has-new { border-color: #f0c040; color: #f0c040; animation: pulse 1.5s infinite; }
    .chronicle-icon { font-size: 20px; }

    /* Chronicle Panel */
    #chronicle-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10,6,2,0.95);
      border-top: 2px solid #8b7355;
      border-radius: 16px 16px 0 0;
      padding: 12px;
      max-height: 70%;
      display: none;
      flex-direction: column;
      z-index: 20;
    }
    #chronicle-panel.open { display: flex; }
    .chronicle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: #d4b896;
    }
    .chronicle-header h3 { font-size: 16px; color: #c0a030; }
    #close-chronicle {
      background: none;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      padding: 2px 6px;
    }
    #chronicle-feed {
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #4a3018 transparent;
    }
    .story-event {
      padding: 8px 0;
      border-bottom: 1px solid rgba(139,115,85,0.3);
      color: #c8b89a;
      font-size: 13px;
      line-height: 1.5;
    }
    .story-event:last-child { border-bottom: none; }
    .event-category {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .cat-Romance { color: #ff69b4; }
    .cat-Betrayal { color: #dc143c; }
    .cat-Heroism { color: #ffd700; }
    .cat-Political { color: #9370db; }
    .cat-Tragedy { color: #4682b4; }
    .cat-Comedy { color: #3cb371; }
    .cat-Prophecy { color: #ba55d3; }
    .cat-Redemption { color: #ff8c00; }
    .event-time { font-size: 10px; color: #666; margin-top: 2px; }

    /* Schism Modal */
    #schism-modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
    }
    #schism-modal.open { display: flex; }
    .modal-card {
      background: #1a0a00;
      border: 2px solid #dc143c;
      border-radius: 12px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      color: #d4b896;
    }
    .modal-card h2 { color: #dc143c; margin-bottom: 8px; font-size: 20px; }
    .modal-card p { font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Georgia', serif;
      text-align: left;
      transition: opacity 0.2s;
    }
    .modal-btn:active { opacity: 0.8; }
    .btn-miracle { background: #1a3a5c; border-color: #4a90d9; color: #87ceeb; }
    .btn-decree { background: #2a1a5c; border-color: #9370db; color: #dda0dd; }
    .btn-exile { background: #3a0a0a; border-color: #dc143c; color: #ff6b6b; }
    .btn-disabled { opacity: 0.4; cursor: not-allowed; }

    /* Game Over Modal */
    #gameover-modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 20px;
    }
    #gameover-modal.open { display: flex; }
    .gameover-card {
      background: #0a0500;
      border: 2px solid #4a90d9;
      border-radius: 12px;
      padding: 28px;
      max-width: 380px;
      width: 100%;
      color: #d4b896;
      text-align: center;
    }
    .gameover-card h2 { color: #4a90d9; font-size: 24px; margin-bottom: 8px; }
    .gameover-card .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .score-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; }
    .score-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .score-value { font-size: 22px; font-weight: bold; color: #f0c040; font-family: monospace; }
    #play-again-btn {
      background: linear-gradient(135deg, #1a4a7a, #2a6aaa);
      border: 1px solid #4a90d9;
      color: #fff;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 15px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      width: 100%;
    }

    /* High Drama Event Toast */
    #drama-toast {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,6,2,0.95);
      border: 2px solid #c0a030;
      border-radius: 10px;
      padding: 12px 16px;
      max-width: 320px;
      width: 90%;
      color: #d4b896;
      font-size: 13px;
      line-height: 1.5;
      z-index: 25;
      display: none;
      text-align: center;
    }
    #drama-toast.show { display: block; animation: fadeInOut 5s forwards; }
    #drama-toast .toast-category { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    #drama-toast .toast-close {
      position: absolute; top: 6px; right: 8px;
      background: none; border: none; color: #888; font-size: 16px; cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 rgba(240,192,64,0.4); }
      50% { box-shadow: 0 0 8px rgba(240,192,64,0.7); }
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div class="hud-top">
        <div id="tide-timer">
          <div class="label">Tide arrives in</div>
          <div class="time" id="timer-display">20:00</div>
          <div id="wave-incoming"></div>
        </div>
        <div id="faith-panel">
          <div class="label">Divine Faith</div>
          <div id="faith-bar-wrap"><div id="faith-bar" style="width:70%"></div></div>
          <div id="faith-value">70 / 100</div>
        </div>
      </div>
      <div class="hud-bottom">
        <div id="resources">
          <div class="res-row">
            <div class="res-item"><span class="res-icon">🐚</span><span class="res-count" id="res-shells">50</span></div>
            <div class="res-item"><span class="res-icon">🌿</span><span class="res-count" id="res-kelp">20</span></div>
            <div class="res-item"><span class="res-icon">🪨</span><span class="res-count" id="res-pebbles">10</span></div>
          </div>
        </div>
        <div id="decree-btn">
          <span class="icon">📜</span>
          <span>DECREE</span>
        </div>
        <div id="chronicle-btn">
          <div class="chronicle-icon">📖</div>
          <div>Chronicle</div>
        </div>
      </div>

      <!-- Chronicle Panel -->
      <div id="chronicle-panel">
        <div class="chronicle-header">
          <h3>📖 The Chronicle</h3>
          <button id="close-chronicle">✕</button>
        </div>
        <div id="chronicle-feed"></div>
      </div>

      <!-- Schism Modal -->
      <div id="schism-modal">
        <div class="modal-card">
          <h2>⚡ SCHISM</h2>
          <p id="schism-text">The colony has lost faith. A faction rises against you.</p>
          <div class="modal-actions">
            <button class="modal-btn btn-miracle" id="btn-miracle">
              <strong>✨ Divine Miracle</strong> — Spend 50 🐚 to part the sands. Restores 30 Faith instantly.
            </button>
            <button class="modal-btn btn-decree" id="btn-decree-schism">
              <strong>📜 Diplomatic Decree</strong> — Grant the faction leader a special title. Slower recovery.
            </button>
            <button class="modal-btn btn-exile" id="btn-exile">
              <strong>🌊 Exile</strong> — Cast the doubter into the sea. Brutal, effective, and noted.
            </button>
          </div>
        </div>
      </div>

      <!-- Drama Toast -->
      <div id="drama-toast">
        <button class="toast-close" id="close-toast">✕</button>
        <div class="toast-category" id="toast-category"></div>
        <div id="toast-text"></div>
      </div>

      <!-- Game Over Modal -->
      <div id="gameover-modal">
        <div class="gameover-card">
          <h2>🌊 The Tide Claims All</h2>
          <div class="subtitle" id="gameover-subtitle">Your castle has fallen to the sea.</div>
          <div class="score-grid">
            <div class="score-item">
              <div class="score-label">Survived</div>
              <div class="score-value" id="score-time">0:00</div>
            </div>
            <div class="score-item">
              <div class="score-label">Crabs Saved</div>
              <div class="score-value" id="score-crabs">0</div>
            </div>
            <div class="score-item">
              <div class="score-label">Stories</div>
              <div class="score-value" id="score-stories">0</div>
            </div>
            <div class="score-item">
              <div class="score-label">Peak Faith</div>
              <div class="score-value" id="score-faith">0</div>
            </div>
          </div>
          <button id="play-again-btn">Play Again</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
